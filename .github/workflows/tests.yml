# Tests a chaque envoi, sous Linux et sous Windows.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"   # sorties accentuees dans les journaux Windows

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Typage (mypy)
        run: mypy
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construction de l'interface
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run types
          npm run build
      - name: Tests d'interface (Playwright)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure() && runner.os == 'Linux'
        with:
          name: rapport-playwright
          path: frontend/playwright-report
          retention-days: 7
