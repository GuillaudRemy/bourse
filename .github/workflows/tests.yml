# Tests a chaque envoi, sous Linux et sous Windows.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"   # sorties accentuees dans les journaux Windows

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construction de l'interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
