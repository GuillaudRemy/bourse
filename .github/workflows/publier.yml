# Publication d'une version : declenchee par une etiquette vX.Y.Z (outils/publier.sh).
#
# Tout se passe sur un vrai Windows : construction du paquet, test de fumee du paquet,
# installateur, installation silencieuse, test de fumee de l'application INSTALLEE.
# La publication GitHub n'est creee que si tout est vert : l'application de bureau
# ne voit donc jamais une version qui n'a pas demarre sous Windows.
name: Publier

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"   # sorties accentuees dans les journaux Windows

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Paquet
        run: python outils/assembler.py "${{ github.ref_name }}"

      - name: Test de fumee du paquet
        run: python outils/test_fumee.py paquet

      - name: Installateur
        run: |
          choco install innosetup --no-progress -y
          $env:BOURSE_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installateur\bourse.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installation silencieuse
        run: |
          $p = Start-Process sortie\Bourse-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\Bourse"
          if (-not (Test-Path "$app\python\python.exe")) { throw "python.exe absent apres installation" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Bourse.lnk")) { throw "raccourci du bureau absent" }

      - name: Test de fumee de l'application installee
        run: python outils/test_fumee.py "$env:LOCALAPPDATA\Programs\Bourse"

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" sortie\Bourse-Setup.exe --title "Bourse ${{ github.ref_name }}" --notes-from-tag
