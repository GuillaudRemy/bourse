# Publication d'une version : declenchee par une etiquette vX.Y.Z (outils/publier.sh).
#
# Chaque systeme est construit et teste sur une vraie machine de ce systeme :
#   windows : paquet, test de fumee, installateur, installation silencieuse, test de l'appli INSTALLEE
#   linux   : Ubuntu 24.04, paquet, test de fumee, installer.sh, test de l'appli INSTALLEE
# puis, sur chacun, le test de mise a jour N-1 -> N (signature, essai, retour arriere, donnees).
# Les fichiers publies sont accompagnes de SHA256SUMS signe (secret CLE_SIGNATURE) : l'application
# refuse toute mise a jour dont la signature ne correspond pas. Etiquette vX.Y.Z-beta.N : pre-version.
# La publication GitHub n'est creee que si les deux sont verts : l'application de bureau
# ne voit donc jamais une version qui n'a pas demarre sur son systeme.
name: Publier

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"   # sorties accentuees dans les journaux Windows

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Signature de code (supprime l'avertissement SmartScreen) : inactive tant que la variable
      # de depot SIGNATURE_WINDOWS ne vaut pas « oui ». Voir README, « Signature de code Windows ».
      SIGNATURE_WINDOWS: ${{ vars.SIGNATURE_WINDOWS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Paquet
        run: python outils/assembler.py "${{ github.ref_name }}" windows

      - name: Test de fumee du paquet
        run: python outils/test_fumee.py paquet

      - name: Installateur
        run: |
          choco install innosetup --no-progress -y
          $env:BOURSE_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installateur\bourse.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Signature de code (si configuree)
        if: env.SIGNATURE_WINDOWS == 'oui'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNATURE_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNATURE_COMPTE }}
          certificate-profile-name: ${{ vars.SIGNATURE_PROFIL }}
          files: ${{ github.workspace }}\sortie\Bourse-Setup.exe
          file-digest: SHA256
          timestamp-digest: SHA256
          description: Bourse
          description-url: https://github.com/GuillaudRemy/bourse

      - name: Verification de la signature de code
        if: env.SIGNATURE_WINDOWS == 'oui'
        run: |
          $s = Get-AuthenticodeSignature sortie\Bourse-Setup.exe
          if ($s.Status -ne "Valid") { throw "installateur non signe : $($s.StatusMessage)" }

      - name: Installation silencieuse
        run: |
          $p = Start-Process sortie\Bourse-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\Bourse"
          if (-not (Test-Path "$app\python\python.exe")) { throw "python.exe absent apres installation" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\Bourse.lnk")) { throw "raccourci du bureau absent" }

      - name: Test de fumee de l'application installee
        run: python outils/test_fumee.py "$env:LOCALAPPDATA\Programs\Bourse"

      - name: Test de mise a jour N-1 -> N
        env:
          GH_TOKEN: ${{ github.token }}
          CLE_SIGNATURE: ${{ secrets.CLE_SIGNATURE }}
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Bourse"
          $prec = (gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName').TrimStart("v")
          # Les versions anterieures a 0.5.0 ne savent pas lire une publication de test : on simule N-1.
          if ([version]$prec -ge [version]"0.5.0") {
            gh release download "v$prec" -p Bourse-Setup.exe -D precedente
            $p = Start-Process precedente\Bourse-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOLAUNCH" -Wait -PassThru
            if ($p.ExitCode -ne 0) { exit 1 }
          } else {
            Set-Content -Path "$app\VERSION" -Value "0.0.1"
          }
          python -u outils/test_mise_a_jour.py "$app" sortie\Bourse-Setup.exe "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: sortie/Bourse-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Paquet
        run: python outils/assembler.py "${{ github.ref_name }}" linux

      - name: Test de fumee du paquet
        run: python outils/test_fumee.py paquet

      - name: Installation depuis l'archive
        run: |
          mkdir -p /tmp/telechargement && cd /tmp/telechargement
          tar xzf "$GITHUB_WORKSPACE/sortie/bourse-linux-x86_64.tar.gz"
          ./bourse/installer.sh
          test -x "$HOME/.local/share/bourse/app/python/bin/python3"
          test -f "$HOME/.local/share/applications/bourse.desktop"

      - name: Test de fumee de l'application installee
        run: python outils/test_fumee.py "$HOME/.local/share/bourse/app"

      - name: Test de mise a jour N-1 -> N
        env:
          GH_TOKEN: ${{ github.token }}
          CLE_SIGNATURE: ${{ secrets.CLE_SIGNATURE }}
        run: |
          APP="$HOME/.local/share/bourse/app"
          PREC=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          # Les versions anterieures a 0.5.0 ne savent pas lire une publication de test : on simule N-1.
          if [ "$(printf '%s\n0.5.0\n' "$PREC" | sort -V | head -1)" = "0.5.0" ]; then
            gh release download "v$PREC" -p bourse-linux-x86_64.tar.gz -D /tmp/precedente
            (cd /tmp/precedente && tar xzf bourse-linux-x86_64.tar.gz && ./bourse/installer.sh)
          else
            echo 0.0.1 > "$APP/VERSION"
          fi
          python -u outils/test_mise_a_jour.py "$APP" sortie/bourse-linux-x86_64.tar.gz "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: sortie/bourse-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  publication:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: sortie
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Empreintes et signature
        env:
          CLE_SIGNATURE: ${{ secrets.CLE_SIGNATURE }}
        run: |
          pip install --quiet cryptography
          python outils/signer.py sortie sortie/Bourse-Setup.exe sortie/bourse-linux-x86_64.tar.gz
          python outils/signer.py --verifier sortie
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          BETA=$([[ "${{ github.ref_name }}" == *-beta* ]] && echo --prerelease || true)
          gh release create "${{ github.ref_name }}" sortie/Bourse-Setup.exe sortie/bourse-linux-x86_64.tar.gz \
            sortie/SHA256SUMS sortie/SHA256SUMS.sig $BETA \
            --title "Bourse ${{ github.ref_name }}" --notes-from-tag
