[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["exemple", "bourse", "paquet", "frontend", "backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = [
    "E712",   # « == False » est l'idiome SQLAlchemy
    "B008",   # Depends(...) en valeur par defaut est l'idiome FastAPI
    "E741",   # « l » pour une ligne de resultat, comme dans le reste du code
    "SIM108",
    "UP006", "UP035", "UP045",   # Optional[...] / List[...] : style du projet exemple, lu par SQLModel
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]   # l'environnement doit etre fixe avant d'importer le backend

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Typage progressif : tout le backend est verifie, sauf les modules de la liste ci-dessous,
# a retirer un par un en les corrigeant (surtout des requetes SQLModel et des Valeur | None).
[tool.mypy]
python_version = "3.12"
files = ["backend"]
exclude = ["backend/migrations/"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Modules encore a typer completement (requetes SQLModel surtout) : 5 restants sur 14 en 0.6.1.
module = [
    "backend.services.analyse_service", "backend.services.portefeuille_service", "backend.services.stockage",
    "backend.services.valeur_service", "backend.sources.sec",
]
ignore_errors = true
