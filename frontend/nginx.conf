server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # /api/xxx -> backend:8010/xxx
    location /api/ {
        proxy_pass http://backend:8010/;
        proxy_read_timeout 300s;      # « Tout actualiser » telecharge chaque valeur
        client_max_body_size 20m;
    }

    # Application monopage : toute autre adresse sert index.html.
    location / {
        try_files $uri /index.html;
    }
}
